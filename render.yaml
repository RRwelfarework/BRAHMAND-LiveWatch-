services:
  - type: web
    name: brahmand-livewatch
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brahmand-livewatch-db
          property: connectionString

databases:
  - name: brahmand-livewatch-db
    databaseName: brahmand_livewatch
    user: brahmand_livewatch
    plan: free
    region: singapore
